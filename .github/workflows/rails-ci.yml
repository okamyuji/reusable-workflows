name: Rails CI (reusable)

on:
  workflow_call:
    inputs:
      lint-command:
        description: "Lint command"
        type: string
        default: "bin/rubocop -f github"
      security-scan:
        description: "Run brakeman and bundler-audit"
        type: boolean
        default: true
      run-tests:
        description: "Run the test job"
        type: boolean
        default: true
      run-lint:
        description: "Run the lint job (disable together with security-scan/run-tests to consume only the lockfile guard)"
        type: boolean
        default: true
      test-command:
        description: "Test command"
        type: string
        default: "bin/rails db:test:prepare test"
      with-mysql:
        description: "Attach a MySQL 8 service container to the test job"
        type: boolean
        default: false
      lockfile-check:
        description: "Verify Gemfile.lock is self-consistent (regenerate with bundle lock and diff)"
        type: boolean
        default: true
      working-directory:
        description: "Directory containing the Rails app (Gemfile)"
        type: string
        default: "."

jobs:
  # Gemfile.lockの自己整合性検証。dependabotのgem更新がCHECKSUMSセクションを
  # 更新し忘れると、frozenモードのbundle installがexit 16で全ジョブを巻き込んで
  # 落ちる（2026-07-12 rails-state-machine-importのsorbet-static不整合で実証。
  # 2026-07-31 big_tree_tableでも再発したが、同リポジトリはrails-ci.ymlを呼んで
  # いなかったためこのガードが走らなかった。テスト等を自前jobで持つリポジトリは
  # run-lint/security-scan/run-tests をfalseにしてlockfileガードだけを消費できる）。
  # bundler-cacheを使わないのは意図的: cacheつきsetup-rubyはlockfileが壊れて
  # いるとこの検証に到達する前に不親切なエラーで落ちるため。
  lockfile:
    if: inputs.lockfile-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Verify Gemfile.lock is self-consistent
        working-directory: ${{ inputs.working-directory }}
        run: |
          # .bundle/configのfrozen=trueは環境変数より優先されるためlocal configで解除する
          bundle config set --local frozen false
          bundle lock
          git diff --exit-code Gemfile.lock || {
            echo "::error file=Gemfile.lock::Gemfile.lock is inconsistent (stale CHECKSUMS or resolution drift). Run 'bundle config set --local frozen false && bundle lock' locally and commit the result."
            exit 1
          }

  scan_ruby:
    if: inputs.security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}
      - name: Brakeman
        working-directory: ${{ inputs.working-directory }}
        run: bin/brakeman --no-pager
      - name: Bundler audit
        working-directory: ${{ inputs.working-directory }}
        run: bin/bundler-audit --update || bundle exec bundler-audit check --update

  lint:
    if: inputs.run-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}
      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}

  test:
    if: inputs.run-tests && !inputs.with-mysql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}
      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ${{ inputs.working-directory }}/tmp/screenshots
          if-no-files-found: ignore

  test-mysql:
    if: inputs.run-tests && inputs.with-mysql
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}
      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ${{ inputs.working-directory }}/tmp/screenshots
          if-no-files-found: ignore
