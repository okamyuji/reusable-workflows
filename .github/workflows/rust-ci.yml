name: Rust CI (reusable)

on:
  workflow_call:
    inputs:
      test-command:
        description: "Test command"
        type: string
        default: "cargo test --all-targets"
      apt-packages:
        description: "Space-separated apt packages to install before building (e.g. GTK for GUI crates). Empty installs nothing"
        type: string
        default: ""

jobs:
  rust-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system packages
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        # 入力をrunへ直接埋め込まず環境変数で渡す。`-s`などを混ぜるとapt-getのオプションとして読まれ、
        # 何もインストールせずに成功してしまうため、`-`で始まる語は拒否する。
        run: |
          read -r -a apt_packages <<< "$APT_PACKAGES"
          for package in "${apt_packages[@]}"; do
            case "$package" in
              -*) echo "apt-packages must contain package names, not options: $package" >&2; exit 1 ;;
            esac
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${apt_packages[@]}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: ${{ inputs.test-command }}
