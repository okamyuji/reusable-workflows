name: Semver tag (reusable)

# 既定ブランチへの push ごとに、その先頭の commit に注釈付きタグを1つ付ける。版は前のタグからの
# commit すべての Conventional Commits の種類で決める（feat!: や本文の BREAKING CHANGE があれば major、
# feat があれば minor、それ以外は patch）。
# 呼び出し側のジョブに permissions: contents: write が必要。
on:
  workflow_call:

concurrency:
  group: semver-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tag:
    # 既定ブランチへの push 以外では付けない。別ブランチで番号が先に使われると main のタグ付けが止まるため
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag the pushed head
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # >>> semver-tag
          set -eu
          # GITHUB_TOKEN には workflows 権限が無く、GitHub は .github/workflows の中身が既定ブランチの先頭と
          # 違う tree を指すタグを拒否する（git push も REST API も同じ）。そのため commit ごとではなく、
          # 既定ブランチの先頭そのものにだけ付ける。先頭が先へ進んでいれば、その push の実行に任せる
          head=$(git rev-parse HEAD)
          # パイプにすると ls-remote の失敗が隠れて「先へ進んだ」と誤って成功するので、結果を一度受ける
          remote=$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH")
          tip=${remote%%[[:space:]]*}
          if [ "$tip" != "$head" ]; then
            echo "skip: $DEFAULT_BRANCH has moved to $tip; the run for that push tags it"
            exit 0
          fi
          # v1.2.3-rc1 や先頭が0の v1.0.08 を算術式に入れないよう、厳密に vX.Y.Z の形のタグだけを基準にする
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if git tag --points-at "$head" | grep -qE "$semver"; then
            exit 0
          fi
          last=$(git tag --merged HEAD --sort=-v:refname | grep -E "$semver" | head -n 1 || true)
          if [ -n "$last" ]; then
            ver=${last#v}
            range="$last..HEAD"
          else
            ver=0.0.0
            range=HEAD
          fi
          major=${ver%%.*}
          rest=${ver#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          # commit メッセージは外部入力なので、grep で種類を判定するだけにして展開しない
          bump=patch
          for sha in $(git rev-list "$range"); do
            if git log -1 --format=%s "$sha" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' \
              || git log -1 --format=%b "$sha" | grep -qE '^BREAKING[ -]CHANGE:'; then
              bump=major
              break
            elif git log -1 --format=%s "$sha" | grep -qE '^feat(\([^)]*\))?:'; then
              bump=minor
            fi
          done
          case $bump in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"
          git tag -a "$tag" -m "$tag" "$head"
          git push -q origin "refs/tags/$tag"
          echo "$tag $head"
          # <<< semver-tag
