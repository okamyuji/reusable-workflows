name: Ruby audit (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing Gemfile.lock"
        type: string
        default: "."

jobs:
  bundler-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # bundler-audit reads only Gemfile.lock, so no bundle install and no project Ruby version are needed
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          # an old BUNDLED WITH may not install on this Ruby, and the audit needs no Bundler
          bundler: none

      - name: Install bundler-audit
        run: gem install bundler-audit --version 0.9.3 --no-document

      - name: Bundler audit
        run: bundle-audit check --update
